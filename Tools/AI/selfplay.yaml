# Use --ai-opponent SelfPlay in the environment. Both team controllers share the policy.
behaviors:
  ArthalionCombatV1:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      deterministic: true
    reward_signals:
      extrinsic:
        gamma: 1.0
        strength: 1.0
    time_horizon: 128
    max_steps: 1000000
    summary_freq: 5000
    checkpoint_interval: 25000
    keep_checkpoints: 10
    threaded: false
    self_play:
      window: 8
      play_against_latest_model_ratio: 0.5
      save_steps: 25000
      swap_steps: 5000
      team_change: 50000
engine_settings:
  time_scale: 1
  target_frame_rate: -1
  no_graphics: true
